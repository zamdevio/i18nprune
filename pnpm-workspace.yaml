packages:
  - packages/*
  - apps/*
  - apps/workers/*
  # VS Code extension dashboard (Vite/React); separate package.json from extension host
  - apps/extension/src/webview

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

overrides:
  '@types/react': 18.3.28
  '@types/react-dom': 18.3.7
  axios: '>=1.16.0'
  form-data: '>=4.0.6'
  postcss: '>=8.5.10'
